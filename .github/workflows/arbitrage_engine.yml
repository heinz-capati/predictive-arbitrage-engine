name: Live Market Scraper & Arbitrage Sync

on:
  schedule:
    # Runs automatically every day at 12:00 AM UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
    # Adds a "Run workflow" button in GitHub so you can trigger it manually anytime

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11" # Matches a stable modern Python environment

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Create Firebase Credentials File
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > backend/firebase_credentials.json

      - name: Run Arbitrage Pipeline
        env:
          # Assuming your script looks for this env var for the credentials path
          GOOGLE_APPLICATION_CREDENTIALS: backend/firebase_credentials.json
        run: |
          python backend/pipeline_bridge.py --sync
